plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'com.krayapp.duopress'
    compileSdk 36

    defaultConfig {
        applicationId "com.krayapp.duopress"
        minSdk 25
        targetSdk 35
        versionCode 250
        versionName "2.5.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Подпись release-сборки. Пароли можно задать через переменные окружения или
    // через ~/.gradle/gradle.properties (vvtmKeystorePassword / vvtmKeyPassword).
    // Если переменные не заданы, используется стандартный Android debug-ключ
    // (~/.android/debug.keystore) — этого достаточно для локальной сборки и
    // самостоятельной установки APK.
    signingConfigs {
        release {
            // Используем стандартный debug-ключ по умолчанию, лежащий в ~/.android/debug.keystore.
            // Это самый честный fallback: тот же ключ, что Android Studio использует для debug.
            def defaultStore = new File(System.getProperty("user.home"), ".android/debug.keystore")
            storeFile file(System.env.VVTM_KEYSTORE ?: defaultStore.absolutePath)
            storePassword System.env.VVTM_KEYSTORE_PASSWORD ?: "android"
            keyAlias System.env.VVTM_KEY_ALIAS ?: "androiddebugkey"
            keyPassword System.env.VVTM_KEY_PASSWORD ?: "android"
        }
    }

    buildTypes {
        debug {
            // Отдельный applicationId позволяет тестировать debug рядом с установленной release-версией.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    // HiddenApiBypass — библиотека от LSPosed, которая снимает блокировку @hide API
    // на Android P+. Без неё reflection на IVoiceInteractionManagerService.showSessionFromSession
    // падает с NoSuchMethodException. Аналогично работает сам MiCTS / VISTrigger.
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    def composeBom = platform('androidx.compose:compose-bom:2025.05.01')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'sh.calvin.reorderable:reorderable:3.0.0'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.9'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'

    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
